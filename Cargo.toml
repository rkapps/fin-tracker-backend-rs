[workspace]
resolver = "2"
members = ["crates/*", "bin/*"]

[workspace.dependencies]
anyhow = "1.0.100"
async-trait = "0.1"
axum = { version = "0.8.8", features = ["macros"] }
bincode = "1"

bson = { version = "3.1", features = ["serde", "chrono-0_4", "serde_with-3"] }
calamine = "0.24"
candle-core = "0.9"
candle-nn = "0.9"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.9"

clap = { version = "4", features = ["derive"] }
futures = "0.3"
google-cloud-storage = { version = "0.20", features = ["default"] }

linfa = "0.8.1"
linfa-linear = "0.8.1"
linfa-ensemble = "0.8.1"
linfa-trees = "0.8.1"

mongodb = { version = "3.5.1", features = ["bson-3"] }
ndarray = "0.16"
serde_with = { version = "3.0", features = ["macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.148"

rand = "0.8"
rayon = "1.11"

reqwest = { version = "0.12.28", features = ["json", "stream", "multipart"]}
rust_decimal = { version = "1.35", features = ["serde"] }
rust_decimal_macros = "1.40.0"

ta = "0.5"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
tower-http = {version = "0.6.8", features = ["cors"]}
tracing = {version = "0.1.40"}
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }


# Point to the relative path on your machine
#storage-core = { path = "../libs/storage-core-rs" }
#agentic-core = { path = "../libs/agentic-core-rs" }
#agentic-boot = { path = "../libs/agentic-boot" }
#storage-core = { git = "https://github.com/rkapps/storage-core-rs" }
#agentic-core = { git = "https://github.com/rkapps/agentic-core-rs" }
#agentic-boot = { git = "https://github.com/rkapps/agentic-boot" }

rustic-agent = { path = "../rustic-ai-backend-rs/crates/rustic-agent" }
rustic-boot = { path = "../rustic-ai-backend-rs/crates/rustic-boot" }
rustic-core = { path = "../rustic-ai-backend-rs/crates/rustic-core" }
rustic-storage = { path = "../rustic-ai-backend-rs/crates/rustic-storage" }
rustic-ml = { path = "../rustic-ai-backend-rs/crates/rustic-ml" }

# Local app crates
fin-analyse = { path = "crates/fin-analyse" }
fin-core = { path = "crates/fin-core" }
fin-domain = { path = "crates/fin-domain" }
fin-services = { path = "crates/fin-services" }
fin-storage = { path = "crates/fin-storage"}
fin-providers = { path = "crates/fin-providers"}


